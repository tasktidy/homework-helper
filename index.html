<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业小助手</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4A90D9;
            --primary-dark: #3A7BC8;
            --secondary: #FF8C42;
            --secondary-dark: #E67A35;
            --bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --text: #333333;
            --text-light: #666666;
            --border: #E8E8E8;
            --chinese: #E74C3C;
            --english: #3498DB;
            --math: #27AE60;
            --science: #9B59B6;
            --other: #95A5A6;
            --success: #2ECC71;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
        }

        .input-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .student-info-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px dashed var(--border);
            flex-wrap: wrap;
            align-items: center;
        }

        .input-field {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .input-field label {
            font-weight: 600;
            color: var(--text);
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .input-field input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(74, 144, 217, 0.15);
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .subject-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .subject-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .subject-card[data-subject="语文"] .subject-icon { background: rgba(231, 76, 60, 0.15); }
        .subject-card[data-subject="英语"] .subject-icon { background: rgba(52, 152, 219, 0.15); }
        .subject-card[data-subject="数学"] .subject-icon { background: rgba(39, 174, 96, 0.15); }
        .subject-card[data-subject="科学"] .subject-icon { background: rgba(155, 89, 182, 0.15); }
        .subject-card[data-subject="其他"] .subject-icon { background: rgba(149, 165, 166, 0.15); }

        .subject-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .subject-card[data-subject="语文"] .subject-name { color: var(--chinese); }
        .subject-card[data-subject="英语"] .subject-name { color: var(--english); }
        .subject-card[data-subject="数学"] .subject-name { color: var(--math); }
        .subject-card[data-subject="科学"] .subject-name { color: var(--science); }
        .subject-card[data-subject="其他"] .subject-name { color: var(--other); }

        .subject-card textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: white;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .subject-card textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .subject-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 8px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 144, 217, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 217, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 140, 66, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 66, 0.5);
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .output-section {
            display: none;
            margin-top: 30px;
        }

        .output-section.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .export-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .export-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .export-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .btn-export {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--success) 0%, #27AE60 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        .homework-content {
            background: var(--bg);
            border-radius: 16px;
            padding: 25px;
        }

        .output-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .subject-block {
            margin-bottom: 0;
            padding: 18px;
            background: white;
            border-radius: 12px;
            border: 2px solid var(--border);
        }

        .encyclopedia-section {
            margin-top: 0;
            grid-column: 1 / -1;
        }

        .subject-block[data-subject="语文"] { 
            border-color: var(--chinese); 
        }
        .subject-block[data-subject="英语"] { 
            border-color: var(--english); 
        }
        .subject-block[data-subject="数学"] { 
            border-color: var(--math); 
        }
        .subject-block[data-subject="科学"] { 
            border-color: var(--science); 
        }
        .subject-block[data-subject="其他"] { 
            border-color: var(--other); 
        }

        .subject-block-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subject-count {
            font-size: 0.85rem;
            font-weight: normal;
            color: var(--text-light);
            background: #E8E8E8;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .subject-block[data-subject="语文"] .subject-block-title { color: var(--chinese); }
        .subject-block[data-subject="英语"] .subject-block-title { color: var(--english); }
        .subject-block[data-subject="数学"] .subject-block-title { color: var(--math); }
        .subject-block[data-subject="科学"] .subject-block-title { color: var(--science); }
        .subject-block[data-subject="其他"] .subject-block-title { color: var(--other); }

        .homework-list {
            list-style: none;
        }

        .homework-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            line-height: 1.3;
            border-bottom: 1px solid var(--border);
        }

        .homework-item:last-child {
            border-bottom: none;
        }

        .homework-item-left {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            text-align: left;
        }

        .item-number {
            font-weight: 600;
            color: var(--text-light);
            min-width: 24px;
        }

        .checkbox {
            font-size: 1.5rem;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .encyclopedia-section {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
            border-radius: 12px;
            border: 2px solid #FF9800;
        }

        .encyclopedia-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: #E65100;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .tips-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .tip-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.5;
            padding: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
        }

        .tip-category {
            font-weight: 600;
            color: #E65100;
            flex-shrink: 0;
        }

        .btn-change {
            margin-top: 12px;
            padding: 8px 18px;
            background: var(--science);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-change:hover {
            background: #8E44AD;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .input-section, .export-card {
                padding: 20px;
            }

            .subjects-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            .btn-container {
                flex-direction: column;
            }

            .export-header {
                flex-direction: column;
                text-align: center;
            }
        }

        /* 导出专用样式 */
        .export-wrapper {
            width: 794px;
            background: white;
            padding: 40px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .export-wrapper .output-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .export-wrapper .export-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary);
        }

        .export-wrapper .homework-content {
            padding: 20px;
        }

        .export-wrapper .output-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .export-wrapper .subject-block {
            margin-bottom: 0;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--border);
        }

        .export-wrapper .subject-block[data-subject="语文"] { border-color: var(--chinese); }
        .export-wrapper .subject-block[data-subject="英语"] { border-color: var(--english); }
        .export-wrapper .subject-block[data-subject="数学"] { border-color: var(--math); }
        .export-wrapper .subject-block[data-subject="科学"] { border-color: var(--science); }
        .export-wrapper .subject-block[data-subject="其他"] { border-color: var(--other); }

        .export-wrapper .homework-item {
            padding: 3px 0;
            line-height: 1.3;
        }

        .export-wrapper .encyclopedia-section {
            margin-top: 0;
            padding: 16px;
            grid-column: 1 / -1;
        }

        .export-wrapper .tips-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .export-wrapper .tip-item {
            padding: 6px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .export-wrapper .tip-category {
            font-size: 0.85rem;
        }

        .export-wrapper .btn-export,
        .export-wrapper .btn-change {
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 作业小助手</h1>
            <p>轻松整理每日作业，一键导出打印</p>
        </div>

        <div class="input-section">
            <div class="student-info-row">
                <div class="input-field">
                    <label for="studentName">👧 学生姓名</label>
                    <input type="text" id="studentName" placeholder="例如：刘静嘉">
                </div>
                <div class="input-field">
                    <label for="inputDate">📅 日期</label>
                    <input type="date" id="inputDate">
                </div>
            </div>

            <div class="subjects-grid">
                <div class="subject-card" data-subject="语文">
                    <div class="subject-header">
                        <div class="subject-icon">📖</div>
                        <span class="subject-name">语文</span>
                    </div>
                    <textarea id="chineseInput" placeholder="输入语文作业内容..."></textarea>
                    <div class="subject-hint">格式示例：1. 完成练习册第23页；2. 背诵古诗《静夜思》</div>
                </div>

                <div class="subject-card" data-subject="英语">
                    <div class="subject-header">
                        <div class="subject-icon">🔤</div>
                        <span class="subject-name">英语</span>
                    </div>
                    <textarea id="englishInput" placeholder="输入英语作业内容..."></textarea>
                    <div class="subject-hint">格式示例：1. 抄写单词第15-16页；2. 跟读课文录音</div>
                </div>

                <div class="subject-card" data-subject="数学">
                    <div class="subject-header">
                        <div class="subject-icon">🔢</div>
                        <span class="subject-name">数学</span>
                    </div>
                    <textarea id="mathInput" placeholder="输入数学作业内容..."></textarea>
                    <div class="subject-hint">格式示例：1. 完成口算题卡20道；2. 复习第三单元知识点</div>
                </div>

                <div class="subject-card" data-subject="科学">
                    <div class="subject-header">
                        <div class="subject-icon">🔬</div>
                        <span class="subject-name">科学</span>
                    </div>
                    <textarea id="scienceInput" placeholder="输入科学作业内容..."></textarea>
                    <div class="subject-hint">格式示例：1. 观察植物生长记录；2. 完成实验报告</div>
                </div>

                <div class="subject-card" data-subject="其他">
                    <div class="subject-header">
                        <div class="subject-icon">📋</div>
                        <span class="subject-name">其他</span>
                    </div>
                    <textarea id="otherInput" placeholder="输入其他作业内容..."></textarea>
                    <div class="subject-hint">格式示例：1. 手工制作；2. 体育锻炼30分钟</div>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn btn-primary" onclick="generateHomework()">
                    ✨ 整理作业
                </button>
            </div>
        </div>

        <div class="output-section" id="outputSection">
            <div class="export-card">
                <div class="export-header">
                    <div class="export-title" id="outputTitle">作业小助手 • 今日作业</div>
                    <button class="btn-export" onclick="exportToImage()">
                        📥 导出图片
                    </button>
                </div>

                <div class="homework-content" id="homeworkContent">
                    <!-- 作业内容将由JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">导出成功！</div>

    <script>
        const SUBJECTS_ORDER = ['语文', '英语', '数学', '科学', '其他'];
        const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

        const TIPS = [
            { category: '好习惯', text: '今日事今日毕，写作业不要拖延哦！' },
            { category: '好习惯', text: '写字姿势要正确，保护好眼睛和脊椎。' },
            { category: '好习惯', text: '写完作业记得检查一遍，提高准确率。' },
            { category: '好习惯', text: '保持桌面整洁，文具用完要放回原位。' },
            { category: '好习惯', text: '每天坚持阅读半小时，积累更多知识。' },
            { category: '好习惯', text: '早睡早起，保证充足的睡眠很重要。' },
            { category: '好性格', text: '遇到不会的题目，先思考再请教别人。' },
            { category: '好性格', text: '学习要细心，粗心大意可不行哦！' },
            { category: '好性格', text: '耐心是学习的好帮手，慢慢来不着急。' },
            { category: '好性格', text: '相信自己，你是最棒的学习小能手！' },
            { category: '好性格', text: '和同学互相帮助，共同进步更有趣。' },
            { category: '好性格', text: '遇到困难不要怕，勇敢面对才能成长。' },
            { category: '好性格', text: '不会的题目不气馁，多问一句、多练一遍就会进步。' },
            { category: '好性格', text: '失败是成功之母，一次没做对不代表什么。' },
            { category: '高效', text: '番茄工作法：专注25分钟，休息5分钟，效率翻倍！' },
            { category: '高效', text: '先做难的题目，简单的留到最后。' },
            { category: '高效', text: '利用碎片时间背单词，积少成多。' },
            { category: '高效', text: '做完一科作业再换另一科，注意力更集中。' },
            { category: '高效', text: '用不同颜色的笔标记重点，学习更有条理。' },
            { category: '高效', text: '先把作业按难易排个序，先攻最难的，后面越写越顺。' },
            { category: '高效', text: '给自己设定小目标，完成后记得奖励自己！' },
            { category: '高效', text: '用思维导图整理知识点，记得更牢固。' }
        ];

        let currentTips = [];

        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
        });

        function parseHomeworkInput(input) {
            if (!input.trim()) return [];

            let items = input.split(/[；;]/).map(item => item.trim()).filter(item => item);

            items = items.map(item => {
                return item.replace(/^\d+[.、)）]\s*/, '').trim();
            });

            return items;
        }

        function getRandomTips(count = 3) {
            const shuffled = [...TIPS].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, Math.min(count, TIPS.length));
        }

        function changeTips() {
            currentTips = getRandomTips(6);
            renderTips();
        }

        function renderTips() {
            const tipsHtml = currentTips.map(tip => `
                <div class="tip-item">
                    <span class="tip-category">${tip.category}：</span>
                    <span>${tip.text}</span>
                </div>
            `).join('');

            const existingSection = document.querySelector('.encyclopedia-section');
            if (existingSection) {
                existingSection.querySelector('.tips-container').innerHTML = tipsHtml;
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekday = WEEKDAYS[date.getDay()];
            return `${year}年${month}月${day}日 ${weekday}`;
        }

        function generateHomework() {
            const studentName = document.getElementById('studentName').value.trim();
            const inputDate = document.getElementById('inputDate').value;

            if (!studentName) {
                showToast('请输入学生姓名！');
                document.getElementById('studentName').focus();
                return;
            }

            if (!inputDate) {
                showToast('请选择日期！');
                document.getElementById('inputDate').focus();
                return;
            }

            const subjectsData = {
                '语文': parseHomeworkInput(document.getElementById('chineseInput').value),
                '英语': parseHomeworkInput(document.getElementById('englishInput').value),
                '数学': parseHomeworkInput(document.getElementById('mathInput').value),
                '科学': parseHomeworkInput(document.getElementById('scienceInput').value),
                '其他': parseHomeworkInput(document.getElementById('otherInput').value)
            };

            const hasAnyHomework = Object.values(subjectsData).some(items => items.length > 0);

            if (!hasAnyHomework) {
                showToast('请至少输入一项作业内容！');
                return;
            }

            document.getElementById('outputTitle').textContent = `作业清单 - ${studentName} | ${formatDate(inputDate)}`;

            let contentHtml = '<div class="output-grid">';

            SUBJECTS_ORDER.forEach(subject => {
                const items = subjectsData[subject];
                if (items.length === 0) return;

                const iconMap = {
                    '语文': '📖',
                    '英语': '🔤',
                    '数学': '🔢',
                    '科学': '🔬',
                    '其他': '📋'
                };

                const listItems = items.map((item, index) => `
                    <li class="homework-item">
                        <div class="homework-item-left">
                            <span class="item-number">${index + 1}.</span>
                            <span>${item}</span>
                        </div>
                        <span class="checkbox">☐</span>
                    </li>
                `).join('');

                let subjectBlock = `
                    <div class="subject-block" data-subject="${subject}">
                        <div class="subject-block-title">
                            ${iconMap[subject]} ${subject}
                            <span class="subject-count">（共${items.length}项）</span>
                        </div>
                        <ul class="homework-list">
                            ${listItems}
                        </ul>
                    </div>
                `;

                contentHtml += subjectBlock;
            });

            currentTips = getRandomTips(6);
            const tipsHtml = currentTips.map(tip => `
                <div class="tip-item">
                    <span class="tip-category">${tip.category}：</span>
                    <span>${tip.text}</span>
                </div>
            `).join('');

            const encyclopediaBlock = `
                <div class="encyclopedia-section">
                    <div class="encyclopedia-header">
                        🌟 小学生百科小贴士
                    </div>
                    <div class="tips-container">
                        ${tipsHtml}
                    </div>
                    <button class="btn-change" onclick="changeTips()">🔄 换一换</button>
                </div>
            `;

            contentHtml += encyclopediaBlock;
            contentHtml += '</div>';

            document.getElementById('homeworkContent').innerHTML = contentHtml;

            const outputSection = document.getElementById('outputSection');
            outputSection.classList.add('show');
            outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function exportToImage() {
            const studentName = document.getElementById('studentName').value.trim() || '作业清单';
            const inputDate = document.getElementById('inputDate').value;
            const date = inputDate ? inputDate.replace(/-/g, '-') : new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');

            const exportWrapper = document.createElement('div');
            exportWrapper.className = 'export-wrapper';
            exportWrapper.style.cssText = 'position: absolute; left: -9999px; top: 0;';

            const title = document.createElement('div');
            title.className = 'export-title';
            title.textContent = `作业清单 - ${studentName} | ${formatDate(inputDate || new Date().toISOString().split('T')[0])}`;

            const content = document.createElement('div');
            content.className = 'homework-content';
            content.innerHTML = document.getElementById('homeworkContent').innerHTML;

            exportWrapper.appendChild(title);
            exportWrapper.appendChild(content);
            document.body.appendChild(exportWrapper);

            try {
                const canvas = await html2canvas(exportWrapper, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    width: 794,
                    logging: false
                });

                const link = document.createElement('a');
                link.download = `${studentName}_作业清单_${date}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('图片导出成功！');
            } catch (error) {
                console.error('导出失败:', error);
                showToast('导出失败，请重试！');
            } finally {
                document.body.removeChild(exportWrapper);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        document.getElementById('studentName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('chineseInput').focus();
            }
        });
    </script>
</body>
</html>
